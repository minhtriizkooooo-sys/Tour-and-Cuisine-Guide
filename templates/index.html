<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VIET NAM TRAVEL AI GUIDE 2026</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

:root{--primary:#0066cc;--primary-dark:#004a7c;--bg:#f4f7f9;--accent:#f39c12;--text-color:#222}

*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:'Segoe UI',Arial;
height:100dvh;
display:flex;
flex-direction:column;
overflow:hidden;
background:var(--bg)
}

header{
background:linear-gradient(135deg,var(--primary-dark),var(--primary));
color:white;
padding:12px 20px;
height:60px;
display:flex;
justify-content:space-between;
align-items:center;
z-index:2000
}

.logo{
display:flex;
align-items:center;
gap:10px;
font-weight:bold;
font-size:18px
}

.logo img{height:40px}

#hamburger{cursor:pointer;font-size:24px}

main{flex:1;display:flex;overflow:hidden}

#map{width:100%;height:100%}

#sidebar{
position:fixed;
top:60px;
right:-350px;
width:350px;
height:calc(100% - 120px);
background:white;
transition:right .3s;
z-index:1001;
overflow-y:auto;
padding:60px 20px 20px
}

#sidebar.open{right:0}

#close-sidebar{
position:absolute;
top:15px;
right:15px;
font-size:32px;
cursor:pointer
}

.sidebar-section{margin-bottom:30px}

.sidebar-section h3{
color:var(--primary);
font-size:17px;
margin-bottom:15px;
display:flex;
justify-content:space-between;
cursor:pointer
}

.btn-sidebar{
width:100%;
padding:14px;
margin:8px 0;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
color:white
}

.btn-primary{background:var(--primary)}
.btn-danger{background:#e74c3c}
.btn-success{background:#27ae60}

#chat-container{
display:none;
flex-direction:column;
height:100%
}

#chat-box{
flex:1;
overflow:auto;
display:flex;
flex-direction:column;
gap:15px
}

.msg{
padding:12px 16px;
border-radius:16px;
max-width:90%
}

.user{background:var(--primary);color:white;align-self:flex-end}
.bot{background:#f8f9fa}

.input-area{
padding:12px 0;
display:flex;
gap:10px
}

#user-input{
flex:1;
padding:12px 18px;
border:1px solid #ddd;
border-radius:30px
}

.send-btn{
background:var(--primary);
color:white;
border:none;
width:48px;
height:48px;
border-radius:50%;
cursor:pointer
}

footer{
background:#006699;
padding:12px 20px;
display:flex;
justify-content:space-between;
color:white
}

/* MODAL */

#img-modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.95);
z-index:9999;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center
}

#modal-content{
position:relative;
width:90%;
max-width:900px;
height:80vh;
display:flex;
align-items:center;
justify-content:center
}

#modal-img{
max-width:100%;
max-height:80vh;
border-radius:12px
}

#modal-caption{
color:white;
margin-top:15px
}

.modal-nav{
position:absolute;
top:50%;
transform:translateY(-50%);
background:rgba(255,255,255,.2);
border:none;
color:white;
font-size:28px;
padding:15px;
cursor:pointer;
border-radius:50%
}

#prev-img{left:-60px}
#next-img{right:-60px}

#close-modal{
position:absolute;
top:-40px;
right:0;
background:#e74c3c;
color:white;
font-size:24px;
width:40px;
height:40px;
border-radius:50%;
border:none;
cursor:pointer
}

.hidden{display:none!important}

</style>
</head>

<body>

<header>

<div class="logo">
<img src="/static/images/Logo_Marie_Curie.png">
<span>VIET NAM TRAVEL AI GUIDE 2026</span>
</div>

<i id="hamburger" class="fa fa-bars"></i>

</header>

<main>

<div id="map"></div>

<div id="sidebar">

<i id="close-sidebar" class="fa fa-times"></i>

<div class="sidebar-section" id="map-tools">

<h3>Công cụ Bản đồ <i class="fa fa-chevron-down"></i></h3>

<div class="content">

<input id="s-input" placeholder="Nhập địa danh..." style="width:100%;padding:10px;border:1px solid #ddd;border-radius:5px">

<button class="btn-sidebar btn-primary" onclick="findLoc()">Cắm mốc</button>

<button class="btn-sidebar btn-danger" onclick="clearMap()">Xóa Marker</button>

</div>

</div>

<div id="chat-container">

<div id="chat-box"></div>

<div class="input-area">

<input id="user-input" placeholder="Hỏi về địa danh..." onkeypress="if(event.key==='Enter') sendMessage()">

<button class="send-btn" onclick="sendMessage()">
<i class="fa fa-paper-plane"></i>
</button>

</div>

</div>

</div>

</main>

<footer>

<div>Developer: <span style="color:#ffdd59;font-weight:900;">Lại Nguyễn Minh Trí</span></div>

<div>Hotline:
<a href="tel:0908083566" style="color:#ffdd59;font-weight:900;text-decoration:none;">
84.908.08.35.66
</a>
</div>

</footer>

<div id="img-modal" class="hidden">

<div id="modal-content">

<button id="prev-img" class="modal-nav">
<i class="fa fa-chevron-left"></i>
</button>

<img id="modal-img">

<button id="next-img" class="modal-nav">
<i class="fa fa-chevron-right"></i>
</button>

<button id="close-modal">×</button>

</div>

<div id="modal-caption"></div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* MAP */

const map=L.map('map',{zoomControl:false}).setView([10.7769,106.7009],12)

L.tileLayer(
'https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}',
{subdomains:['mt0','mt1','mt2','mt3']}
).addTo(map)

let markers=[]
let galleryImages=[]
let currentImgIndex=0

/* SIDEBAR */

const sidebar=document.getElementById('sidebar')

document.getElementById('hamburger').onclick=()=>sidebar.classList.add('open')
document.getElementById('close-sidebar').onclick=()=>sidebar.classList.remove('open')

/* MAP FUNCTIONS */

function clearMap(){
markers.forEach(m=>map.removeLayer(m))
markers=[]
}

async function findLoc(){

const q=document.getElementById("s-input").value.trim()

if(!q)return

const res=await fetch(
`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q + ", Ho Chi Minh City, Vietnam")}`
)

const data=await res.json()

if(!data[0])return

const pos=[parseFloat(data[0].lat),parseFloat(data[0].lon)]

map.setView(pos,15)

const m=L.marker(pos).addTo(map)
.bindPopup(`<b>${q}</b><br>
<button onclick="askAI('${q}')"
style="margin-top:5px;padding:6px 10px;border:none;border-radius:5px;background:#0066cc;color:white;cursor:pointer">
Hỏi AI
</button>`).openPopup()

markers.push(m)

}

function askAI(loc){

toggleChat()

document.getElementById("user-input").value=
`Thông tin du lịch ${loc}`

sendMessage()

}

/* CHAT */

function toggleChat(){
document.getElementById("chat-container").style.display="flex"
}

async function sendMessage(){

const inp=document.getElementById("user-input")

const msg=inp.value.trim()

if(!msg)return

addMsg("user",msg)

inp.value=""

const res=await fetch("/chat",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({msg})
})

const data=await res.json()

addMsg("bot",data)

}

/* MESSAGE */

function addMsg(role,data){

const box=document.getElementById("chat-box")

const div=document.createElement("div")

div.className="msg "+role

if(role==="user"){

div.textContent=data

}else{

let text=data.text||""

div.innerHTML=text.replace(/\n/g,"<br>")

const imgs=[...(data.images||[]),...(data.future_images||[])]

imgs.forEach((img,i)=>{

let im=document.createElement("img")

im.src=img.url

im.style="width:100%;margin-top:10px;border-radius:10px;cursor:pointer"

im.onclick=()=>showImg(imgs,i)

div.appendChild(im)

})

}

box.appendChild(div)

box.scrollTop=box.scrollHeight

}

/* MODAL */

function showImg(images,index){

galleryImages=images
currentImgIndex=index

updateModal()

document.getElementById("img-modal").classList.remove("hidden")

}

function updateModal(){

let img=galleryImages[currentImgIndex]

document.getElementById("modal-img").src=img.url

document.getElementById("modal-caption").textContent=img.caption||""

document.getElementById("prev-img").style.visibility=
currentImgIndex>0?"visible":"hidden"

document.getElementById("next-img").style.visibility=
currentImgIndex<galleryImages.length-1?"visible":"hidden"

}

document.getElementById("prev-img").onclick=()=>{
if(currentImgIndex>0){currentImgIndex--;updateModal()}
}

document.getElementById("next-img").onclick=()=>{
if(currentImgIndex<galleryImages.length-1){currentImgIndex++;updateModal()}
}

document.getElementById("close-modal").onclick=()=>{
document.getElementById("img-modal").classList.add("hidden")
}

</script>

</body>
</html>

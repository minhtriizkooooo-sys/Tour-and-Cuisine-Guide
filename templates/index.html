<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIET NAM TRAVEL AI 2026</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --primary: #0066cc; --bg: #f4f7f9; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; overflow: hidden; }
        header { background: #004a7c; color: white; height: 60px; display: flex; align-items: center; padding: 0 20px; justify-content: space-between; z-index: 1000; position: relative; }
        main { display: flex; height: calc(100% - 100px); position: relative; }
        #map { flex: 1; height: 100%; }
        
        /* Sidebar */
        #sidebar { 
            position: absolute; right: -400px; width: 400px; height: 100%; 
            background: white; transition: 0.3s; z-index: 2000; 
            display: flex; flex-direction: column; box-shadow: -2px 0 10px rgba(0,0,0,0.1);
        }
        #sidebar.open { right: 0; }
        #chat-box { flex: 1; overflow-y: auto; padding: 15px; background: #f9f9f9; }
        
        /* Messages */
        .msg { margin-bottom: 15px; padding: 12px; border-radius: 10px; max-width: 90%; line-height: 1.5; }
        .bot { background: white; border: 1px solid #ddd; align-self: flex-start; }
        .user { background: var(--primary); color: white; align-self: flex-end; margin-left: auto; }
        
        /* Input */
        .input-area { padding: 10px; display: flex; gap: 5px; border-top: 1px solid #ddd; }
        input#user-input { flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #ccc; }
        
        /* Modal Ảnh - CỰC KỲ QUAN TRỌNG */
        #img-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9); 
            display: none; z-index: 9999; justify-content: center; align-items: center;
        }
        #modal-content { position: relative; width: 90%; max-width: 900px; text-align: center; }
        #modal-img { max-width: 100%; max-height: 80vh; border: 3px solid white; border-radius: 8px; object-fit: contain; }
        .modal-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(255,255,255,0.2); color: white; border: none;
            width: 50px; height: 50px; border-radius: 50%; cursor: pointer; font-size: 24px;
        }
        #prev-btn { left: -60px; }
        #next-btn { right: -60px; }
        #close-btn { 
            position: absolute; top: -50px; right: 0; 
            background: #ff4757; color: white; border: none; 
            width: 40px; height: 40px; border-radius: 50%; cursor: pointer; 
        }
        #modal-caption { color: white; margin-top: 15px; font-weight: bold; }

        footer { height: 40px; background: #004a7c; color: white; display: flex; justify-content: center; align-items: center; font-size: 13px; }
        
        @media (max-width: 500px) {
            #sidebar { width: 100%; right: -100%; }
            #prev-btn { left: 5px; }
            #next-btn { right: 5px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo"><b>VIET NAM TRAVEL AI</b></div>
        <i id="menu-icon" class="fa fa-bars" style="cursor:pointer; font-size:24px;"></i>
    </header>

    <main>
        <div id="map"></div>
        <div id="sidebar">
            <div style="padding: 10px; background: var(--primary); color:white; display:flex; justify-content: space-between;">
                <span>Trợ lý du lịch 2026</span>
                <i class="fa fa-times" id="hide-sidebar" style="cursor:pointer"></i>
            </div>
            <div id="chat-box"></div>
            <div class="input-area">
                <input type="text" id="user-input" placeholder="Nhập địa danh...">
                <button onclick="sendMessage()" style="border:none; background:none; color:var(--primary); font-size:20px; cursor:pointer;">
                    <i class="fa fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </main>

    <div id="img-modal">
        <div id="modal-content">
            <button id="close-btn">&times;</button>
            <button id="prev-btn" class="modal-btn"><i class="fa fa-chevron-left"></i></button>
            <img id="modal-img" src="">
            <button id="next-btn" class="modal-btn"><i class="fa fa-chevron-right"></i></button>
            <div id="modal-caption"></div>
        </div>
    </div>

    <footer>Bản quyền 2026 - Lại Nguyễn Minh Trí</footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([10.7769, 106.7009], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        const sidebar = document.getElementById('sidebar');
        document.getElementById('menu-icon').onclick = () => sidebar.classList.add('open');
        document.getElementById('hide-sidebar').onclick = () => sidebar.classList.remove('open');

        let currentImages = [];
        let currentIndex = 0;

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if(!text) return;

            appendMsg('user', text);
            input.value = '';

            const res = await fetch('/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({msg: text})
            });
            const data = await res.json();
            appendMsg('bot', data);
        }

        function appendMsg(role, data) {
            const box = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.className = `msg ${role}`;

            if(role === 'user') {
                div.textContent = data;
            } else {
                let html = `<div class="text">${data.text.replace(/\n/g, '<br>')}</div>`;
                
                if(data.images && data.images.length > 0) {
                    html += '<div style="display:grid; grid-template-columns:1fr 1fr; gap:5px; margin-top:10px;">';
                    data.images.forEach((img, i) => {
                        html += `<img src="${img.url}" onclick="openGallery('${encodeURIComponent(JSON.stringify(data.images))}', ${i})" 
                                 style="width:100%; height:80px; object-fit:cover; border-radius:5px; cursor:pointer;">`;
                    });
                    html += '</div>';
                }
                div.innerHTML = html;
            }
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        // Gallery Logic
        function openGallery(imagesJson, index) {
            currentImages = JSON.parse(decodeURIComponent(imagesJson));
            currentIndex = index;
            updateModal();
            document.getElementById('img-modal').style.display = 'flex';
        }

        function updateModal() {
            const img = currentImages[currentIndex];
            document.getElementById('modal-img').src = img.url;
            document.getElementById('modal-caption').textContent = img.caption;
        }

        document.getElementById('next-btn').onclick = () => {
            currentIndex = (currentIndex + 1) % currentImages.length;
            updateModal();
        };

        document.getElementById('prev-btn').onclick = () => {
            currentIndex = (currentIndex - 1 + currentImages.length) % currentImages.length;
            updateModal();
        };

        document.getElementById('close-btn').onclick = () => {
            document.getElementById('img-modal').style.display = 'none';
        };

        // Đóng modal khi bấm ra ngoài ảnh
        document.getElementById('img-modal').onclick = (e) => {
            if(e.target.id === 'img-modal') document.getElementById('img-modal').style.display = 'none';
        };
    </script>
</body>
</html>
